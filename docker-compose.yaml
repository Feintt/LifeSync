services:
  postgres:
    image: postgres:19
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: noctia_dev
    volumes:
      - postgres_noctia_data:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  noctia_backend:
    build: .
    volumes:
      - .:/app:Z                  # live source (rootless podman: container root == your user)
      - noctia_deps:/app/deps     # container-owned deps, no clash with host deps/
      - noctia_build:/app/_build  # container-owned build artifacts
      - noctia_mix:/root/.mix     # persists hex/rebar archives
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    restart: always
    ports:
      - 4000:4000
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: postgres
      DB_NAME: noctia_dev
    # first boot / dep changes: podman compose exec noctia_backend mix deps.get
    command: sh -c "mix deps.get && mix ecto.migrate && mix phx.server"

volumes:
  postgres_noctia_data: {}
  noctia_deps: {}
  noctia_build: {}
  noctia_mix: {}
