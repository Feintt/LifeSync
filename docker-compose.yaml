services:
  postgres:
    image: postgres:19
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: noctia_dev
    volumes:
      - postgres_noctia_data:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  noctia_backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    restart: always
    ports:
      - 4000:4000
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: noctia_dev
      DB_HOST: postgres

volumes:
  postgres_noctia_data: {}
